name: Zbuduj aplikacje APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Capacitora
        run: npm install

      - name: Budowa srodowiska Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Konfiguracja Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Kompilacja APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Publikacja pliku APK
        uses: actions/upload-artifact@v4
        with:
          name: SkawisHomeApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
